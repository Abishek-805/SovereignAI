<!doctype html><html lang="en"><head><meta charset="utf-8"><title>UI repair fixture</title><style>html{box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}body{margin:0;padding:48px;background:#eef3f7;color:#203344;font:16px Arial,sans-serif}h1{font-size:28px;margin:0 0 28px}p{line-height:1.5}#form{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:640px}label{display:flex;flex-direction:column;gap:8px;font-weight:bold}input{padding:12px;border:1px solid #9aaec0;border-radius:6px;font:inherit}#submit{grid-column:1/-1;padding:14px;background:#173e66;color:white;border:0;border-radius:6px;font:inherit}</style></head><body><h1>Reserve a desk</h1><form id="form"><label id="name-label" for="name">Full name<input id="name" value="Mira Shah"></label><label id="email-label" for="email">Email<input id="email" value="mira@example.test"></label><label id="date-label" for="date">Date<input id="date" type="date" value="2026-10-05"></label><label id="guests-label" for="guests">Guests<input id="guests" type="number" value="2"></label><button id="submit" type="submit">Confirm reservation</button></form></body></html>
